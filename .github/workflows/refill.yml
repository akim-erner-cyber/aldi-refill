name: Aldi Refill Automatisch

on:
  schedule:
    # Läuft standardmäßig alle 30 Minuten (kannst du anpassen)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-refill:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run python aldi_refill.py
        env:
          ALDI_NUMMER: ${{ secrets.ALDI_NUMMER }}
          ALDI_PASSWORT: ${{ secrets.ALDI_PASSWORT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python aldi_refill.py

      - name: Debug-Dateien bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dateien
          path: |
            debug.png
            debug.html
          retention-days: 3
